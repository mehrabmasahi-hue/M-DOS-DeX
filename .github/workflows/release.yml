name: Publish M-DOS DeX Preview

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APKs
        run: gradle --no-daemon assemblePhoneDebug assembleTvDebug

      - name: Prepare downloads
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/phone/debug/*.apk release-files/M-DOS-DeX-Phone.apk
          cp app/build/outputs/apk/tv/debug/*.apk release-files/M-DOS-DeX-Android-TV.apk
          cd release-files
          sha256sum *.apk > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            release-files/M-DOS-DeX-Phone.apk
            release-files/M-DOS-DeX-Android-TV.apk
            release-files/SHA256SUMS.txt
