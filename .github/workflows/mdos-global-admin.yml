name: Build M-DOS Global Admin APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "global-admin/**"
      - ".github/workflows/mdos-global-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Global Admin APK
        run: gradle --no-daemon -p global-admin assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M-DOS-Global-Admin-APK
          path: global-admin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
